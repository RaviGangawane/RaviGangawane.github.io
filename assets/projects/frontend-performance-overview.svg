<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Frontend performance dashboard concept</title><desc id="desc">Core Web Vitals targets are passing and four optimization workstreams are displayed.</desc>
<rect width="1200" height="675" rx="28" fill="#07101e"/><rect x="28" y="28" width="1144" height="619" rx="20" fill="#0c182a" stroke="#34527d"/><text x="66" y="79" fill="#f5f7fb" font-family="system-ui" font-size="26" font-weight="700">Frontend Performance Program</text><text x="66" y="112" fill="#a8b3c7" font-family="system-ui" font-size="16">Representative route · Mobile target profile</text>
<g font-family="system-ui"><rect x="65" y="145" width="320" height="146" rx="17" fill="#0d2430" stroke="#45c48b"/><text x="91" y="183" fill="#a8b3c7" font-size="16">LARGEST CONTENTFUL PAINT</text><text x="91" y="245" fill="#73e0ae" font-size="48" font-weight="700">&lt; 2.5s</text><text x="287" y="245" fill="#73e0ae" font-size="17">Target</text><rect x="440" y="145" width="320" height="146" rx="17" fill="#0d2430" stroke="#45c48b"/><text x="466" y="183" fill="#a8b3c7" font-size="16">INTERACTION TO NEXT PAINT</text><text x="466" y="245" fill="#73e0ae" font-size="48" font-weight="700">&lt; 200ms</text><rect x="815" y="145" width="320" height="146" rx="17" fill="#0d2430" stroke="#45c48b"/><text x="841" y="183" fill="#a8b3c7" font-size="16">CUMULATIVE LAYOUT SHIFT</text><text x="841" y="245" fill="#73e0ae" font-size="48" font-weight="700">&lt; 0.1</text>
<text x="65" y="350" fill="#62a8ff" font-size="18" font-weight="700">OPTIMIZATION WORKSTREAMS</text><rect x="65" y="380" width="245" height="164" rx="16" fill="#111f35"/><text x="89" y="421" fill="#fff" font-size="19" font-weight="700">Critical path</text><text x="89" y="456" fill="#a8b3c7" font-size="15">Priorities · Fonts</text><text x="89" y="482" fill="#a8b3c7" font-size="15">Render-blocking CSS</text><rect x="335" y="380" width="245" height="164" rx="16" fill="#111f35"/><text x="359" y="421" fill="#fff" font-size="19" font-weight="700">JavaScript</text><text x="359" y="456" fill="#a8b3c7" font-size="15">Route splitting</text><text x="359" y="482" fill="#a8b3c7" font-size="15">Long-task reduction</text><rect x="605" y="380" width="245" height="164" rx="16" fill="#111f35"/><text x="629" y="421" fill="#fff" font-size="19" font-weight="700">Images</text><text x="629" y="456" fill="#a8b3c7" font-size="15">Responsive sources</text><text x="629" y="482" fill="#a8b3c7" font-size="15">Modern formats</text><rect x="875" y="380" width="260" height="164" rx="16" fill="#111f35"/><text x="899" y="421" fill="#fff" font-size="19" font-weight="700">Guardrails</text><text x="899" y="456" fill="#a8b3c7" font-size="15">CI budgets</text><text x="899" y="482" fill="#a8b3c7" font-size="15">Field monitoring</text></g>
<rect x="65" y="580" width="1070" height="35" rx="10" fill="#0a1423"/><rect x="65" y="580" width="830" height="35" rx="10" fill="#163e51"/><text x="600" y="604" text-anchor="middle" fill="#d7e2f2" font-family="system-ui" font-size="14">Performance is a release constraint, not a one-time cleanup</text>
</svg>
