<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Knowledge graph exploration interface concept</title><desc id="desc">Search and filters sit beside a connected graph with a details panel for the selected entity.</desc>
<rect width="1200" height="675" rx="28" fill="#07101e"/><rect x="28" y="28" width="1144" height="619" rx="20" fill="#0c182a" stroke="#34527d"/>
<rect x="28" y="28" width="1144" height="72" rx="20" fill="#111f35"/><text x="65" y="73" fill="#f5f7fb" font-family="system-ui" font-size="25" font-weight="700">Connected Information Explorer</text><rect x="733" y="47" width="395" height="36" rx="10" fill="#07101e" stroke="#4f76aa"/><text x="753" y="71" fill="#a8b3c7" font-family="system-ui" font-size="15">Search entities and relationships…</text>
<rect x="55" y="130" width="215" height="470" rx="16" fill="#0a1423"/><text x="80" y="170" fill="#62a8ff" font-family="system-ui" font-size="17" font-weight="700">FILTERS</text><g fill="#d7e2f2" font-family="system-ui" font-size="16"><text x="80" y="216">☑ Applications</text><text x="80" y="256">☑ Services</text><text x="80" y="296">☑ Teams</text><text x="80" y="336">☐ Archived</text></g><rect x="78" y="390" width="166" height="42" rx="9" fill="#16345a"/><text x="161" y="417" text-anchor="middle" fill="#f5f7fb" font-family="system-ui" font-size="15">Structured list view</text>
<g stroke="#5479aa" stroke-width="3"><path d="M470 235L615 330M615 330L785 210M615 330L810 440M615 330L430 465M470 235L400 350"/></g><g font-family="system-ui" text-anchor="middle"><circle cx="615" cy="330" r="72" fill="#1b4c7f" stroke="#75b5ff" stroke-width="4"/><text x="615" y="325" fill="#fff" font-size="20" font-weight="700">Platform</text><text x="615" y="351" fill="#c8dcf5" font-size="14">Selected entity</text><circle cx="470" cy="235" r="49" fill="#172c48" stroke="#62a8ff"/><text x="470" y="241" fill="#fff" font-size="15">Web App</text><circle cx="785" cy="210" r="49" fill="#252448" stroke="#9878ff"/><text x="785" y="216" fill="#fff" font-size="15">Identity</text><circle cx="810" cy="440" r="49" fill="#283047" stroke="#e0955b"/><text x="810" y="446" fill="#fff" font-size="15">API</text><circle cx="430" cy="465" r="49" fill="#173a3a" stroke="#73e0ae"/><text x="430" y="471" fill="#fff" font-size="15">Team</text><circle cx="400" cy="350" r="39" fill="#172c48" stroke="#62a8ff"/><text x="400" y="356" fill="#fff" font-size="13">Mobile</text></g>
<rect x="925" y="130" width="220" height="470" rx="16" fill="#0a1423"/><text x="951" y="170" fill="#62a8ff" font-family="system-ui" font-size="17" font-weight="700">ENTITY DETAILS</text><text x="951" y="220" fill="#fff" font-family="system-ui" font-size="23" font-weight="700">Platform</text><text x="951" y="253" fill="#a8b3c7" font-family="system-ui" font-size="15">Application group</text><line x1="951" y1="280" x2="1117" y2="280" stroke="#34527d"/><text x="951" y="320" fill="#a8b3c7" font-family="system-ui" font-size="14">4 relationships</text><text x="951" y="350" fill="#a8b3c7" font-family="system-ui" font-size="14">3 owners</text><rect x="951" y="394" width="166" height="44" rx="9" fill="#16345a"/><text x="1034" y="422" text-anchor="middle" fill="#fff" font-family="system-ui" font-size="15">Expand neighbors</text>
